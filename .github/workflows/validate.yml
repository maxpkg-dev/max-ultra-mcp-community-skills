name: Validate catalog
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned test dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Test validation and automation boundaries
        run: python3 -m unittest discover -s tests -v
      - name: Check metadata and generated pages
        run: python3 tools/catalog.py check
      - name: Build and validate each import ZIP
        run: python3 tools/catalog.py build
