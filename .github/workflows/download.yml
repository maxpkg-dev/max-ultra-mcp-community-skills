name: Refresh published skill download
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      skill:
        description: Accepted skill ID to initialize or retry
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: accepted-skill-releases
  cancel-in-progress: false
jobs:
  refresh:
    if: "github.event_name == 'workflow_dispatch' || (!github.event.release.draft && !github.event.release.prerelease && !endsWith(github.event.release.tag_name, '-latest'))"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify accepted package and refresh its stable download
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/rolling.py --event
