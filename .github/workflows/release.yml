name: Publish accepted skills
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: accepted-skill-releases
  cancel-in-progress: false
jobs:
  release:
    if: vars.ENABLE_SKILL_RELEASES == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: skill-releases
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned test dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Recheck accepted source and create deterministic packages
        run: |
          python3 -m unittest discover -s tests -v
          python3 tools/catalog.py check
          python3 tools/catalog.py build
      - name: Publish immutable per-skill version assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release.py
